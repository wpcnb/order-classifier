name: Classic football game balance
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "tests/classic-balance.cjs"
      - "tests/classic-world.cjs"
      - "tests/classic-generations.cjs"
      - "data/verified-youth-2026.json"
      - ".github/workflows/classic-balance.yml"
  pull_request:
    paths:
      - "index.html"
      - "tests/classic-balance.cjs"
      - "tests/classic-world.cjs"
      - "tests/classic-generations.cjs"
      - "data/verified-youth-2026.json"
      - ".github/workflows/classic-balance.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulated-career:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test career scoring and award balance
        run: node tests/classic-balance.cjs
      - name: Test realistic aging, sponsorships and career rankings
        run: node tests/classic-world.cjs
      - name: Test verified academy prospects and 68-season rebirth dynasty
        run: node tests/classic-generations.cjs
