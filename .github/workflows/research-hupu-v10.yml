name: Inspect Hupu reference game for v10
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/research-hupu-v10.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Fetch exact user-supplied Hupu game URL and inspect real DOM
        shell: bash
        run: |
          set -u
          url="https://activity-static.hupu.com/shaper/published/app_b0ed4d1269/index.html?night="
          echo "REFERENCE_URL=$url"
          curl --connect-timeout 12 --max-time 25 -L -sS -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36' -o /tmp/hupu.html -w 'HTTP_STATUS=%{http_code} BYTES=%{size_download} REDIRECT_URL=%{url_effective}\n' "$url" || true
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Extract(HTMLParser):
           def __init__(self): super().__init__(); self.skip=0; self.parts=[]
           def handle_starttag(self,t,a):
            if t in ('script','style'): self.skip+=1
           def handle_endtag(self,t):
            if t in ('script','style'): self.skip=max(0,self.skip-1)
           def handle_data(self,t):
            if not self.skip and t.strip():self.parts.append(t.strip())
          p=Path('/tmp/hupu.html')
          if p.exists():
           content=p.read_text(errors='replace'); e=Extract();e.feed(content)
           print('RAW_META_PREFIX='+content[:1400].replace('\n',' ')[:1400])
           print('RAW_VISIBLE_TEXT='+' | '.join(e.parts)[:11000])
          PY
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then echo "NO_CHROME_INSTALLED"; exit 0; fi
          "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=10000 --dump-dom "$url" >/tmp/dom.html 2>/tmp/chrome.txt || true
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Extract(HTMLParser):
           def __init__(self): super().__init__();self.skip=0;self.parts=[]
           def handle_starttag(self,t,a):
            if t in ('script','style'):self.skip+=1
           def handle_endtag(self,t):
            if t in ('script','style'):self.skip=max(0,self.skip-1)
           def handle_data(self,t):
            if not self.skip and t.strip():self.parts.append(t.strip())
          p=Path('/tmp/dom.html')
          if p.exists():
           s=p.read_text(errors='replace');e=Extract();e.feed(s)
           print('CHROME_DOM_LENGTH=',len(s))
           print('CHROME_TEXT='+' | '.join(e.parts)[:16000])
          print('CHROME_LOG=',Path('/tmp/chrome.txt').read_text(errors='replace')[:2000] if Path('/tmp/chrome.txt').exists() else '')
          PY

      - name: Inspect embedded game structures, menus and browser boot dependencies
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re
          s=Path('/tmp/hupu.html').read_text(errors='replace') if Path('/tmp/hupu.html').exists() else ''
          print('SOURCE_LENGTH',len(s))
          print('START_BODY_CONTEXT',s[s.find('<body'):s.find('<body')+4500][:4500])
          print('END_BODY_CONTEXT',s[-5000:])
          scripts=re.findall(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I)
          print('SCRIPT_COUNT',len(scripts))
          for i,(attr,body) in enumerate(scripts):
           print('SCRIPT',i,'ATTR',attr[:400],'INLINE_BYTES',len(body),'PREVIEW',body[:450])
          pats=['赛季','球员','主教练','战术','转会','阵型','联赛','球队','属性','体力','赛程','比赛','生涯','战报','工资','合同','职位','引援','青训','存档','登录','api','localStorage','React','Vue','iframe','iframeSrc','getUserInfo','hupu']
          for p in pats:
           instances=[m.start() for m in list(re.finditer(re.escape(p),s,re.I))[:4]]
           print('PATTERN',p,'COUNT',len(re.findall(re.escape(p),s,re.I)),'CONTEXTS',[s[max(0,i-75):i+110].replace('\\n',' ') for i in instances])
          PY

      - name: Inspect actual embedded FM football manager page
        shell: bash
        run: |
          url="https://activity-static.hupu.com/shaper/published/app_b0ed4d1269/__ai_app.html"
          echo "APP_URL=$url"
          curl --connect-timeout 12 --max-time 25 -L -sS -A 'Mozilla/5.0' -o /tmp/hupu-app.html -w 'GAME_HTTP_STATUS=%{http_code} BYTES=%{size_download}\n' "$url" || true
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          class Extract(HTMLParser):
           def __init__(self): super().__init__();self.skip=0;self.items=[]
           def handle_starttag(self,t,a):
            if t in ('script','style'):self.skip+=1
           def handle_endtag(self,t):
            if t in ('script','style'):self.skip=max(0,self.skip-1)
           def handle_data(self,t):
            if not self.skip and t.strip():self.items.append(t.strip())
          p=Path('/tmp/hupu-app.html')
          if p.exists():
           s=p.read_text(errors='replace');x=Extract();x.feed(s)
           print('APP_HEAD=',s[:1700].replace('\\n',' '))
           print('APP_STATIC_TEXT='+' | '.join(x.items)[:22000])
           print('APP_SCRIPT_TAGS=',re.findall(r'<script[^>]*>',s,re.I)[:20])
           for term in ('fm','战术','转会','赛季','阵容','球队','比赛','球员','新游戏','存档','状态','欧冠','联赛','工资','资金','薪资','续约','报名','登录'):
            print('APP_WORD',term,'COUNT',s.count(term))
          PY
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then exit 0; fi
          "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=13000 --dump-dom "$url" >/tmp/game-dom.html 2>/tmp/game-chrome.txt || true
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Extract(HTMLParser):
           def __init__(self):super().__init__();self.skip=0;self.items=[]
           def handle_starttag(self,t,a):
            if t in ('script','style'):self.skip+=1
           def handle_endtag(self,t):
            if t in ('script','style'):self.skip=max(0,self.skip-1)
           def handle_data(self,t):
            if not self.skip and t.strip():self.items.append(t.strip())
          p=Path('/tmp/game-dom.html')
          if p.exists():
           s=p.read_text(errors='replace');x=Extract();x.feed(s)
           print('APP_RENDERED_DOM_BYTES=',len(s))
           print('APP_RENDERED_VISIBLE_TEXT='+' | '.join(x.items)[:26000])
          p=Path('/tmp/game-chrome.txt')
          if p.exists():print('APP_CHROME_ERRORS=',p.read_text(errors='replace')[-2400:])
          PY

      - name: Inspect FM home navigations without submitting gameplay actions
        shell: bash
        run: |
          npm install --prefix /tmp/hupuresearch puppeteer-core@24.20.0 --no-audit --no-fund --silent || { echo "PUPPETEER_INSTALL_FAILED"; exit 0; }
          cat >/tmp/hupuresearch/inspect.cjs <<'JS'
          const pp=require("puppeteer-core");
          (async()=>{
           const browser=await pp.launch({headless:true,executablePath:process.env.CHROME_BINARY||"/usr/bin/google-chrome",args:["--no-sandbox","--disable-dev-shm-usage"]});
           const target="https://activity-static.hupu.com/shaper/published/app_b0ed4d1269/__ai_app.html";
           for(const [mode,index] of [["full-manager",0],["light-manager",1],["story",0]]){
            const page=await browser.newPage();await page.setViewport({width:390,height:800});
            await page.goto(target,{waitUntil:"domcontentloaded",timeout:40000});
            await new Promise(resolve=>setTimeout(resolve,4500));
            const before=await page.evaluate(()=>document.body.innerText||"");
            console.log("BEFORE_"+mode+"="+before.slice(0,8500).replace(/\n/g," | "));
            const clicked=await page.evaluate(({mode,index})=>{
             const labels=mode==="story"?["开启故事"]:["选择年代与球队"];
             const els=[...document.querySelectorAll("button,[role=button],a")].filter(x=>labels.some(label=>(x.innerText||x.textContent||"").includes(label)));
             const chosen=els[index]||null;if(chosen){chosen.click();return {count:els.length,label:(chosen.innerText||"").slice(0,80)}}
             return {count:els.length};
            },{mode,index});
            console.log("CLICK_"+mode+"="+JSON.stringify(clicked));
            await new Promise(resolve=>setTimeout(resolve,2500));
            const after=await page.evaluate(()=>document.body.innerText||"");
            console.log("AFTER_"+mode+"="+after.slice(0,14000).replace(/\n/g," | "));
            await page.close();
           }
           await browser.close();
          })().catch(e=>{console.log("BROWSER_NAV_ERROR="+String(e));process.exitCode=0;});
          JS
          CHROME_BINARY="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)" node /tmp/hupuresearch/inspect.cjs

      - name: Inspect first manager dashboard after choosing a club
        shell: bash
        run: |
          if [ ! -d /tmp/hupuresearch/node_modules/puppeteer-core ]; then exit 0; fi
          cat >/tmp/hupuresearch/inspect-club.cjs <<'JS'
          const pp=require("puppeteer-core");
          const sleep=n=>new Promise(r=>setTimeout(r,n));
          (async()=>{
           const browser=await pp.launch({headless:true,executablePath:process.env.CHROME_BINARY||"/usr/bin/google-chrome",args:["--no-sandbox","--disable-dev-shm-usage"]});
           const page=await browser.newPage();await page.setViewport({width:390,height:830});
           await page.goto("https://activity-static.hupu.com/shaper/published/app_b0ed4d1269/__ai_app.html",{waitUntil:"domcontentloaded",timeout:40000});await sleep(4000);
           async function clickText(txt,index=0){
            return page.evaluate(({txt,index})=>{
             const els=[...document.querySelectorAll("button,[role=button],a")].filter(x=>(x.innerText||x.textContent||"").includes(txt));
             const node=els[index];if(node){node.click();return {matches:els.length,clicked:(node.innerText||"").slice(0,120)}}
             return {matches:els.length};
            },{txt,index});
           }
           async function log(label){console.log(label+"="+(await page.evaluate(()=>document.body.innerText||"")).slice(0,15000).replace(/\n/g," | "));}
           console.log("STEP_MODE="+JSON.stringify(await clickText("选择年代与球队",0)));await sleep(1600);
           console.log("STEP_CLUB="+JSON.stringify(await clickText("曼联")));await sleep(1300);await log("AFTER_SELECT_CLUB");
           for(const word of ["开始执教","确认选择","开启生涯","进入俱乐部","开始新游戏"]){
             const result=await clickText(word);
             console.log("ACTION_"+word+"="+JSON.stringify(result));
             if(result.matches){await sleep(2500);await log("AFTER_"+word);break;}
           }
           await browser.close();
          })().catch(e=>console.log("NAVIGATION_ERROR="+e.stack));
          JS
          CHROME_BINARY="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)" node /tmp/hupuresearch/inspect-club.cjs
