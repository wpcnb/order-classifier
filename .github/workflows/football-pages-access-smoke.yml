name: Football game public URL smoke
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/football-pages-access-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify the eleven-player entry points in Chromium
        shell: bash
        run: |
          set -euo pipefail
          root="https://wpcnb.github.io/order-classifier/football-legacy"
          if [[ "${{ github.event_name }}" = "pull_request" ]]; then
            python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/eleven-http.log 2>&1 &
            root="http://127.0.0.1:8123/football-legacy"
            curl --retry 5 --retry-all-errors --fail --silent "$root/" >/dev/null
          fi
          for path in "/" "/play.html" "/?classic=1" "/academy.html"; do
            google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --virtual-time-budget=12000 --dump-dom "$root$path" >/tmp/rendered-eleven.html
            test "$(grep -o 'data-eleven-player="[0-9]*"' /tmp/rendered-eleven.html | wc -l)" -eq 11
            grep -q 'data-eleven-action="next"' /tmp/rendered-eleven.html
            ! grep -q 'data-action="trioSeason"' /tmp/rendered-eleven.html
          done
