name: Public draw simulator and bookmark checks
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/football-pages-access-smoke.yml'
      - 'index.html'
      - 'lottery-research/**'
      - 'football-legacy/*.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Check probability model and draw sampler
        run: |
          python3 -m unittest discover -s lottery-research -p 'test_*.py'
          node --test lottery-research/test_draw.mjs
      - name: Browser reload and archive persistence regression
        run: |
          python3 -m pip install playwright
          python3 -m http.server 8124 --bind 127.0.0.1 >/tmp/archive-http.log 2>&1 &
          curl --retry 5 --retry-all-errors --fail --silent http://127.0.0.1:8124/ >/dev/null
          python3 lottery-research/tests/check_rewind.py http://127.0.0.1:8124
      - name: Optional 3D scene and fallback regression
        run: |
          npm install --prefix /tmp/fc3d-three-test --no-save --ignore-scripts --no-audit --no-fund three@0.186.1
          python3 -m http.server 8125 --bind 127.0.0.1 >/tmp/view3d-http.log 2>&1 &
          curl --retry 5 --retry-all-errors --fail --silent http://127.0.0.1:8125/ >/dev/null
          python3 lottery-research/tests/check_3d.py http://127.0.0.1:8125 /tmp/fc3d-three-test/node_modules/three/build
      - name: Isolated Rapier collision experiment regression
        run: |
          npm install --prefix /tmp/fc3d-physics-test --no-save --ignore-scripts --no-audit --no-fund three@0.186.1 @dimforge/rapier3d-compat@0.21.0
          node lottery-research/tests/check_physics.mjs /tmp/fc3d-physics-test/node_modules/@dimforge/rapier3d-compat/dist/rapier.mjs
          python3 -m http.server 8126 --bind 127.0.0.1 >/tmp/physics-http.log 2>&1 &
          curl --retry 5 --retry-all-errors --fail --silent http://127.0.0.1:8126/ >/dev/null
          python3 lottery-research/tests/check_physics.py http://127.0.0.1:8126 /tmp/fc3d-physics-test/node_modules
      - name: Verify the simulator loads through all public bookmarks
        shell: bash
        run: |
          set -euo pipefail
          root="https://wpcnb.github.io/order-classifier"
          if [[ "${{ github.event_name }}" = "pull_request" ]]; then
            python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/draw-http.log 2>&1 &
            root="http://127.0.0.1:8123"
            curl --retry 5 --retry-all-errors --fail --silent "$root/" >/dev/null
          fi
          for path in "/" "/football-legacy/" "/football-legacy/play.html" "/football-legacy/?classic=1" "/football-legacy/academy.html" "/football-legacy/awards.html"; do
            google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --virtual-time-budget=12000 --dump-dom "$root$path" >/tmp/rendered-draw.html
            grep -q 'id="draw"' /tmp/rendered-draw.html
            grep -q '准备就绪。' /tmp/rendered-draw.html
            test "$(grep -o 'class="ball"' /tmp/rendered-draw.html | wc -l)" -eq 30
            test "$(grep -Eo 'aria-label="第 [0-9]{7} 期公告原文"' /tmp/rendered-draw.html | wc -l)" -eq 100
          done
