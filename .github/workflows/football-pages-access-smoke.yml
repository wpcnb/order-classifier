name: Public draw simulator and bookmark checks
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/football-pages-access-smoke.yml'
      - 'index.html'
      - 'lottery-research/**'
      - 'football-legacy/*.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Check probability model and draw sampler
        run: |
          python3 -m unittest discover -s lottery-research -p 'test_*.py'
          node --test lottery-research/test_draw.mjs
      - name: Verify the simulator loads through all public bookmarks
        shell: bash
        run: |
          set -euo pipefail
          root="https://wpcnb.github.io/order-classifier"
          if [[ "${{ github.event_name }}" = "pull_request" ]]; then
            python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/draw-http.log 2>&1 &
            root="http://127.0.0.1:8123"
            curl --retry 5 --retry-all-errors --fail --silent "$root/" >/dev/null
          fi
          for path in "/" "/football-legacy/" "/football-legacy/play.html" "/football-legacy/?classic=1" "/football-legacy/academy.html" "/football-legacy/awards.html"; do
            google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --virtual-time-budget=12000 --dump-dom "$root$path" >/tmp/rendered-draw.html
            grep -q 'id="draw"' /tmp/rendered-draw.html
            grep -q '准备就绪。' /tmp/rendered-draw.html
            test "$(grep -o 'class="ball"' /tmp/rendered-draw.html | wc -l)" -eq 30
            test "$(grep -Eo 'aria-label="第 [0-9]{7} 期公告原文"' /tmp/rendered-draw.html | wc -l)" -eq 100
          done
