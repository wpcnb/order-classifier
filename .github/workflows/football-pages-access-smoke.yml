name: Football game public URL smoke
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/football-pages-access-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check deployed game and scripts via real HTTPS
        shell: bash
        run: |
          set -euo pipefail
          root="https://wpcnb.github.io/order-classifier/football-legacy/"
          for path in "" "index.html" "game.js?v=6.3.0" "free-star.js?v=6.3.0" "career-depth.js?v=6.2.0" "real-footballers.js?v=4.6.0" "shared-uefa.js?v=season-unified-v58"; do
            url="${root}${path}"
            echo "CHECK: ${url}"
            status=$(curl -A "Mozilla/5.0" --connect-timeout 8 --max-time 18 -L -sS -o /tmp/live-response -w '%{http_code}' "$url")
            bytes=$(wc -c </tmp/live-response)
            echo "HTTP=${status}, bytes=${bytes}"
            test "$status" = "200"
            test "$bytes" -ge 800
            if [[ "$path" = "" || "$path" = "index.html" ]]; then
              grep -q "版本 v6.3.0" /tmp/live-response
            fi
          done
          echo "SUCCESS: deployed game HTML and all essential JS files return 200"
      - name: Confirm browser renders live game, not just HTML
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then
            echo "No preinstalled Chromium found on runner"; exit 1
          fi
          "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=12000 \
            --dump-dom "https://wpcnb.github.io/order-classifier/football-legacy/?v=6.3.0" \
            >/tmp/live-dom.html 2>/tmp/chrome-output.log || { cat /tmp/chrome-output.log; exit 1; }
          echo "Rendered page length: $(wc -c </tmp/live-dom.html)"
          if grep -q 'data-game-loading="1"' /tmp/live-dom.html; then
            echo "Game still on loading fallback after 12 virtual seconds"; tail -40 /tmp/chrome-output.log; exit 1
          fi
          grep -q "双星同场" /tmp/live-dom.html
          echo "Browser succeeded: actual game start screen rendered"
