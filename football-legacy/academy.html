<style>
:root{color-scheme:dark;font:16px/1.6 system-ui,sans-serif;background:#081326;color:#f4f7ff}
*{box-sizing:border-box}body{margin:0}main{max-width:1020px;margin:auto;padding:16px clamp(12px,4vw,36px) 40px}
a{color:#93daff}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
h1,h2,h3,p{margin:0}h2{font-size:1.2rem}small,.muted{color:#bccbda}
.hero{min-height:166px;display:grid;align-content:end;padding:24px;border-radius:16px;background:linear-gradient(90deg,#071627ee,#08142477),url(./assets/matchday.webp) center 44%/cover}
.hero h1{font-size:clamp(1.9rem,6vw,3rem)}section{margin:14px 0;background:#14263a;padding:clamp(14px,3vw,22px);border:1px solid #32495e;border-radius:12px}

button.primary,button[aria-pressed=true]{background:#8debc1;color:#082b27;border-color:#8debc1;font-weight:700}
.score{font-size:clamp(1.2rem,4vw,1.8rem);color:#91ebc5;margin:8px 0}
.roster{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:8px;align-items:start}
