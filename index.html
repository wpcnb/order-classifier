 do{k++;p*=rnd()}while(p>stop&&k<12);

}

   ...y,goals:Math.min(Number(y.goals)||0,Math.min(72,Math.round(apps*cfg.g))),

function buildLeague(p){let clubs=teamList(p).map(c=>c.name);if(!clubs.includes(p.club))clubs.push(p.club);return Object.fromEntries(clubs.map(n=>[n,{name:n,pl:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}]));}
function applyScore(a,b,ga,gb){for(const [first,second,gf,gs] of [[a,b,ga,gb],[b,a,gb,ga]]){const t=s.leagueTable[first];if(!t)continue;t.pl++;t.gf+=gf;t.ga+=gs;t.w+=gf>gs?1:0;t.d+=gf===gs?1:0;t.l+=gf<gs?1:0;t.pts+=gf>gs?3:gf===gs?1:0;}}
function simulateLeague(ourOpp){
 const rounds=s.leagueRounds||[],fixtures=rounds[s.week-1];
 const sim=(a,b)=>{
   const diff=clubPower(a)-clubPower(b);
   return [randomPoisson(clamp(1.36*Math.exp(diff/91),.32,3.15)),
           randomPoisson(clamp(1.10*Math.exp(-diff/91),.26,2.95))]
 };
 if(fixtures){
  for(const g of fixtures){if(g.home===s.club||g.away===s.club)continue;
   const [ha,aa]=sim(g.home,g.away);applyScore(g.home,g.away,ha,aa)}
  return;
 }
 const remaining=Object.keys(s.leagueTable).filter(c=>c!==s.club&&c!==ourOpp);
 remaining.sort(()=>rnd()-.5);
 for(let i=0;i+1<remaining.length;i+=2){
  const [ha,aa]=sim(remaining[i],remaining[i+1]);applyScore(remaining[i],remaining[i+1],ha,aa)
 }
}

function standings(){return Object.values(s.leagueTable||{}).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf);}
function leaguePanel(){let list=standings();if(!list.length)return '';return '<section class="card" style="margin-top:13px"><div class="row"><h2>联赛积分榜</h2><span class="pill">'+esc(leagueName(s))+' · '+s.fixtures+' 轮</span></div><div style="overflow:auto"><table class="standings"><thead><tr><th>排名</th><th>球队</th><th>场次</th><th>胜</th><th>平</th><th>负</th><th>净胜球</th><th>积分</th></tr></thead><tbody>'+list.map((x,i)=>'<tr class="'+(x.name===s.club?'mine':'')+'"><td>'+ (i+1)+'</td><td>'+esc(x.name)+'</td><td>'+x.pl+'</td><td>'+x.w+'</td><td>'+x.d+'</td><td>'+x.l+'</td><td>'+(x.gf-x.ga)+'</td><td><b>'+x.pts+'</b></td></tr>').join('')+'</tbody></table></div></section>';}

function createPlayer(form){
 const pos=form.get('pos')||'ST';
 const name=(form.get('name')||'绿茵新星').toString().trim().slice(0,20)||'绿茵新星';
 const hometown=form.get('country')||'中国';
 const leagueId=LEAGUE_DB[form.get('league')]?form.get('league'):'ENG';
 const youth=youthClubs(leagueId),picked=form.get('academy');
 const club=youth.find(c=>c.name===picked)?.name||youth[0].name;
 const t=rolledTalent||freshTalent(),stats={...t.stats};
 const bonus={ST:{shoot:5},LW:{pace:5,shoot:2},CM:{pass:5},CB:{defense:5,physical:3},GK:{defense:6,physical:2}}[pos]||{};
 for(const k in bonus)stats[k]=ratio(stats[k]+bonus[k]);
 const player={version:2,name,pos,country:hometown,leagueId,age:16,year:2026,season:1,week:1,fixtures:0,phase:'prep',club,tier:0,stats,talent:t,stamina:85,morale:70,form:60,manager:58,fame:8,cash:6000,salary:3500,contract:2,injury:0,trainingUsed:false,match:null,story:null,storyKeys:[],seasonTotals:newSeasonTotals(),totals:{apps:0,goals:0,assists:0,clean:0,saves:0,national:0,nationalGoals:0},awards:[],history:[],log:[],offers:[],difficulty:form.get('diff')||'normal',retired:false,lastResult:'',lastSummary:null,playedClubs:[],sponsor:0,generation:1,family:[],coachCareer:false,coachName:'',continentResults:[],ballots:[],npcs:makeNPC(),tournaments:null};
 player.schedule=makeSchedule(player);
 player.leagueTable=buildLeague(player);player.europe=buildEurope(player);rolledTalent=null;return player;
}

 addLog(s,'已恢复校准前的历史赛季统计；金球奖及其他荣誉未改变。');

function goalTrendChart(){

 const w=680,h=200,pad=29,step=(w-pad*2)/Math.max(1,seasons.length-1);
 const path=(prop)=>seasons.map((y,i)=>(i?'L':'M')+(pad+i*step).toFixed(1)+','+(h-pad-(h-2*pad)*(Number(y[prop])||0)/maxVal).toFixed(1)).join(' ');
 const dots=seasons.map((y,i)=>'<circle cx="'+(pad+i*step).toFixed(1)+'" cy="'+(h-pad-(h-2*pad)*(y.goals||0)/maxVal).toFixed(1)+'" r="4" fill="#f5d087"><title>'+y.year+'年：'+(y.goals||0)+'进球，'+(y.assists||0)+'助攻</title></circle>').join('');
 return '<div class="card" style="margin-top:13px"><h3>最近'+seasons.length+'个赛季 · 进球与助攻趋势</h3>'+
  '<div class="muted small">金色：进球；绿色：助攻。按赛季已保存的统计绘制，不包含未完成赛季。</div>'+
  '<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="历年进球和助攻折线图" style="width:100%;height:auto;min-height:150px;max-height:280px;background:#0b222a;border-radius:12px;margin-top:10px">'+
  '<path d="M'+pad+','+(h-pad)+'H'+(w-pad)+'" stroke="#4b7071" fill="none" stroke-width="2"/>'+
  '<path d="'+path('goals')+'" fill="none" stroke="#f5d087" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>'+
  '<path d="'+path('assists')+'" fill="none" stroke="#70ebad" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'+dots+'</svg>'+
  '<div class="row"><span class="muted small">起始 '+seasons[0].year+'</span><span class="muted small">至 '+seasons[seasons.length-1].year+'</span></div></div>'
}

function startMatch(){if(!s||s.retired||s.story||s.phase!=='prep')return;if(s.injury){completeMatch(-1);return;}let opp=opponent();let moments=s.pos==='GK'?['对手形成单刀，你迎来了最关键的一次扑救。','禁区混战，对方前锋突然起脚。','比赛进入最后十分钟，对方打出快速反击。']:s.pos==='CB'?['对手前锋突破到禁区附近，你必须做出防守决定。','你在后场成功断球，前方出现大片空当。','对方反击形成二打一，后防只剩你一个人。']:['你在禁区弧顶拿到球，队友已经开始跑位。','球队打出反击，你面对空旷的前场。','比赛最后阶段，你获得一次改变战局的机会。'];s.match={opp,moment:pick(moments)};s.phase='moment';tab='match';addLog(s,'第 '+s.week+' 轮：对阵 '+opp.name+' 的比赛开始。');commit();}
function matchChance(index){let st=s.stats;let profile=s.pos==='GK'?[[st.defense,st.mental],[st.physical,st.pace],[st.defense,st.pace]]:s.pos==='CB'?[[st.defense,st.mental],[st.physical,st.pace],[st.pass,st.mental]]:[[st.pass,st.mental],[st.pace,st.shoot],[st.shoot,st.physical]];let pair=profile[index]||profile[0], base=(pair[0]+pair[1])/2;return clamp(.22+base/170+s.form/500+s.morale/800-(s.match.opp.strength-60)/400-(s.difficulty==='hard'?.12:s.difficulty==='easy'?-.10:0)-(s.stamina<35?.13:0),.12,.90);}
function completeMatch(option){
 const opp=s.match?.opp||opponent(),o=over(s),phys=s.stamina,wasInjured=s.injury>0;
 const baseTeam=clubPower(s.club),selected=option>=0;
 const appeared=!wasInjured&&rnd()<clamp(.52+(o-baseTeam)/125+s.manager/330+(s.form-50)/310-(phys<30?.18:0),.30,.95);
 const success=appeared&&selected&&rnd()<matchChance(option);
 const strength=baseTeam-opp.strength;
 const focus=success?1.07:1;
 const offense=clamp(1.30*Math.exp(strength/90)*focus,.28,3.15);
 const defense=clamp(1.12*Math.exp(-strength/110)*(success?.96:1),.25,3.05);
 let homeScore=randomPoisson(offense),awayScore=randomPoisson(defense);
 let goals=0,assists=0,clean=0,saves=0;
 if(appeared){
   const rate=seasonPlayerRate(s)*(success?1.16:1)*(s.difficulty==='hard'?.85:s.difficulty==='easy'?1.11:1);
   goals=Math.min(homeScore,randomPoisson(rate));
   assists=Math.min(Math.max(0,homeScore-goals),randomPoisson(assistRate(s)*(success?1.12:1)));

   saves=s.pos==='GK'?randint(1,7):0;
   if(success&&s.pos==='GK'&&awayScore>0&&rnd()<.20){awayScore--;clean=awayScore===0?1:0}
 }
let rating=appeared?clamp(5.6+(success?.65:-.05)+(goals*.85)+(assists*.5)+(homeScore>awayScore?.35:homeScore===awayScore?.1:-.3)+(rnd()-.5)*1.1,4.2,9.9):0;rating=Math.round(rating*10)/10;
const t=s.seasonTotals;t.w+=homeScore>awayScore?1:0;t.d+=homeScore===awayScore?1:0;t.l+=homeScore<awayScore?1:0;t.points+=homeScore>awayScore?3:homeScore===awayScore?1:0;t.gf+=homeScore;t.ga+=awayScore;if(!s.leagueTable)s.leagueTable=buildLeague(s);const fixture=s.leagueRounds?.[s.week-1]?.find(m=>m.home===s.club||m.away===s.club);if(fixture&&fixture.away===s.club)applyScore(opp.name,s.club,awayScore,homeScore);else applyScore(s.club,opp.name,homeScore,awayScore);simulateLeague(opp.name);simulateNPCWeek();
if(appeared){t.apps++;t.goals+=goals;t.assists+=assists;t.clean+=clean;t.saves+=saves;t.ratings.push(rating);s.totals.apps++;s.totals.goals+=goals;s.totals.assists+=assists;s.totals.clean+=clean;s.totals.saves+=saves;s.form=ratio(s.form+(rating-6.5)*4);s.manager=ratio(s.manager+(rating-6.5)*2.5);s.fame=ratio(s.fame+(rating>=8?2:0));}
const staminaLoss=wasInjured?0:randint(7,16)+(selected&&option===1?4:0);s.stamina=ratio(s.stamina-staminaLoss+randint(6,12));s.morale=ratio(s.morale+(homeScore>awayScore?4:homeScore===awayScore?0:-4));s.cash+=s.salary;s.trainingUsed=false;
if(s.injury)s.injury--;else if(appeared&&phys<38&&rnd()<.13){s.injury=randint(1,3);addLog(s,'赛后出现肌肉伤势，预计缺阵 '+s.injury+' 场。');}
let desc=s.club+' '+homeScore+' : '+awayScore+' '+opp.name+'，'+(appeared?'个人评分 '+rating+'，'+goals+'球 '+assists+'助攻':'本场未登场')+(success?'；关键时刻判断正确':'');s.lastResult=desc;addLog(s,desc);
if(s.week===8&&s.age>=18&&o>=60&&s.fame>=22){let caps=1;s.totals.national+=caps;t.national+=caps;if(rnd()<(.09+o/700)&&s.pos!=='GK'){s.totals.nationalGoals++;}addLog(s,'获得 '+s.country+' 国家队征召，新增 '+caps+' 次出场。');}
s.week++;s.match=null;s.nextOpp=null;s.phase='prep';if(s.week>s.fixtures){endSeason();}else{if([3,6,10,13].includes(s.week)&&!s.storyKeys.includes(s.season+'-'+s.week)){s.storyKeys.push(s.season+'-'+s.week);s.story={index:randint(0,STORIES.length-1)};}}
commit();}
function endSeason(){let t=s.seasonTotals,o=over(s),rank=standings().findIndex(x=>x.name===s.club)+1,won=rank===1&&t.points>=18;let cup=t.points>=24&&rnd()<.30;let leagueLeader=Math.max(0,...s.npcs.filter(n=>n.league===s.leagueId).map(n=>n.goals||0));let scoring=s.pos!=='GK'&&t.apps>=Math.min(12,s.fixtures*.35)&&t.goals>=Math.max(7,leagueLeader);let average=t.ratings.length?t.ratings.reduce((a,b)=>a+b,0)/t.ratings.length:0;
if(won){s.awards.push({year:s.year,type:'title',title:leagueName(s)+'冠军'});s.cash+=120000;s.fame=ratio(s.fame+9);}if(cup){s.awards.push({year:s.year,type:'title',title:'国内杯赛冠军'});s.cash+=40000;s.fame=ratio(s.fame+5);}if(scoring){s.awards.push({year:s.year,type:'personal',title:leagueName(s)+'金靴奖'});s.cash+=18000;s.fame=ratio(s.fame+8);}if(average>=7.85&&t.apps>=Math.min(16,s.fixtures*.45)){s.awards.push({year:s.year,type:'personal',title:'赛季最佳球员'});s.fame=ratio(s.fame+8);}if(s.year%4===2&&s.age>=20&&s.totals.national>=3){let n=rnd();if(n<.13+o/700){s.awards.push({year:s.year,type:'title',title:'国家队洲际冠军'});s.fame=ratio(s.fame+12);}}

if(s.age>32){if(rnd()<.75)s.stats.pace=ratio(s.stats.pace-randint(0,2));if(rnd()<.6)s.stats.physical=ratio(s.stats.physical-1);if(rnd()<.25)s.stats.mental=ratio(s.stats.mental+1)}
 else {const potential=Math.max(s.talent?.potential||85,...Object.values(s.stats));const main=s.pos==='ST'?'shoot':s.pos==='LW'?'shoot':s.pos==='CM'?'pass':s.pos==='CB'?'defense':'mental';if(s.stats[main]<potential&&rnd()<.7)s.stats[main]++;if(s.age<=23&&s.stats.mental<potential&&rnd()<.4)s.stats.mental++}if(s.age>32)s.stamina=ratio(s.stamina-3);s.cash+=t.points*950;
s.lastSummary={won,cup,scoring,average:average.toFixed(2),points:t.points,goals:t.goals,assists:t.assists};s.phase='season_end';s.offers=generateOffers();addLog(s,'赛季结束：'+t.points+'分'+(won?'，荣膺联赛冠军':'')+(cup?'，捧得杯赛冠军':'')+'。');if(s.age>=39){retire();}tab='overview';}
function generateOffers(){if(s.tier===0)return [{club:s.club.replace(/青训$/,''),leagueId:s.leagueId,years:3,salary:6500,stage:'senior',promotion:true}];const overall=over(s),all=Object.entries(LEAGUE_DB).flatMap(([id,d])=>d.teams.map(c=>({...c,leagueId:id})));return all.filter(c=>c.name!==s.club&&c.strength<=overall+22&&c.strength>=overall-18).sort(()=>rnd()-.5).slice(0,5).map(c=>({club:c.name,leagueId:c.leagueId,years:randint(2,5),salary:Math.round((c.strength*300+overall*130+s.fame*80)*(.85+rnd()*.4)/100)*100,stage:'senior'}));}

function doTrain(id){
 if(s.trainingUsed||s.phase!=='prep'||s.story)return;
 const t=DRILLS.find(x=>x.id===id);if(!t)return;
 if(s.stamina<t.cost+6){notice('体能不足，请先恢复');return}
 s.trainingProgress=s.trainingProgress||{};
 s.talent=s.talent||freshTalent();
 const potential=Math.max(s.talent.potential||85,...Object.values(s.stats));
 let upgraded=[];
 if(id!=='rest')for(const k in t.up){
   if(s.stats[k]>=potential)continue;
   const exp=(s.trainingProgress[k]||0)+(k===Object.keys(t.up)[0]?2:1);
   const threshold=s.age<=21?4:s.age<=29?6:9;
   if(exp>=threshold){s.stats[k]=clamp(s.stats[k]+1,0,potential);s.trainingProgress[k]=exp-threshold;upgraded.push(STAT_NAMES[k])}
   else s.trainingProgress[k]=exp;

function doSign(i){let offer=s.offers[i];if(!offer||s.retired)return;if(s.tier===1&&offer.stage==='youth'){notice('一线队球员不能转回青训队。');return;}const old=s.club;s.club=offer.club;s.leagueId=offer.leagueId||leagueForClub(offer.club);s.tier=1;s.salary=offer.salary;s.contract=offer.years;s.manager=55;s.morale=ratio(s.morale+8);s.offers=[];s.nextOpp=null;s.fixtures=(teamList(s).length-1)*2;s.schedule=makeSchedule(s);s.leagueTable=buildLeague(s);addLog(s,'完成'+(offer.promotion?'青训升入一线队':'跨队转会')+'：'+old+' → '+s.club+'，周薪 '+money(s.salary)+'。');commit();notice('加入一线队：'+s.club);}

function fastThree(){
 if(!s||s.retired||s.phase==='season_end')return;
 batching=true;let played=0;
 try{
  while(played<3&&s.phase!=='season_end'&&!s.retired){
   if(s.story)resolveStory(0);
   if(s.phase==='moment'&&s.match){completeMatch(s.injury?-1:(s.pos==='GK'?2:0));played++;continue;}
   if(s.phase!=='prep')break;
   s.match={opp:opponent(),moment:'快速模拟'};s.phase='moment';
   completeMatch(s.injury?-1:(s.pos==='GK'?2:0));played++;
  }
 }finally{batching=false;}
 tab='overview';commit();notice('已完成 '+played+' 轮，当前进度 '+Math.min(s.week-1,s.fixtures)+'/'+s.fixtures);
}
function chooseAutoTraining(){
 if(s.stamina<65)return 'rest';
 const w={
  ST:{shoot:.48,pace:.12,pass:.12,mental:.16,physical:.12},
  LW:{shoot:.34,pace:.26,pass:.23,mental:.12,physical:.05},
  CM:{pass:.42,mental:.23,physical:.13,pace:.10,defense:.12},
  CB:{defense:.41,physical:.23,mental:.21,pace:.10,pass:.05},
  GK:{defense:.48,mental:.24,physical:.21,pass:.05,pace:.02}
 }[s.pos]||{shoot:.35,pass:.25,pace:.20,mental:.20};
 const potential=Math.max(s.talent?.potential||85,...Object.values(s.stats));
 const available=DRILLS.filter(x=>x.id!=='rest').map(d=>({id:d.id,weight:Object.keys(d.up).reduce((sum,k)=>sum+(w[k]||.01)*Math.max(0,potential-s.stats[k]),0)})).sort((a,b)=>b.weight-a.weight);

}
function autoSeason(){
 if(!s||s.retired||s.phase==='season_end')return;
 const remaining=s.fixtures-s.week+1;
 if(!confirm('将自动模拟剩余 '+remaining+' 轮联赛，期间自动处理普通剧情与训练。结束后可以查看积分榜、奖项和转会报价。确定继续？'))return;
 let count=0;
 batching=true;
 try{
  while(count<Math.max(s.fixtures,44)&&s.phase!=='season_end'&&!s.retired){
   if(s.story)resolveStory(0);
   if(s.phase==='moment'&&s.match){completeMatch(s.injury?-1:(s.pos==='GK'?2:0));count++;continue;}
   if(s.phase!=='prep')break;
   if(!s.trainingUsed){let choice=chooseAutoTraining();doTrain(choice);}
   s.match={opp:opponent(),moment:'一键模拟'};s.phase='moment';
   completeMatch(s.injury?-1:(s.pos==='GK'?2:0));count++;
  }
 }finally{batching=false;}

}

async function importSave(file){if(!file||file.size>1024*1024){notice('存档文件过大或无效');return;}try{const txt=await file.text();let data=JSON.parse(txt),candidate=data.save||data;if(!defCheck(candidate))throw Error('存档结构不匹配');if(!confirm('导入存档将替换当前进度，确定继续吗？'))return;s=candidate;tab='overview';commit();notice('存档导入成功');}catch(e){notice('导入失败：不是兼容的 v2 存档');}}
function commit(){if(!batching){save();render();}}
function render(){const app=$('app');if(!s){app.innerHTML=welcome();return;}if(s.phase==='moment'&&!s.match){s.phase='prep';}if(!['overview','match','training','market','career','save','europe'].includes(tab))tab='overview';let body={overview,match:matchPanel,training:trainingPanel,market:marketPanel,career:careerPanel,save:savePanel,europe:europePanel}[tab]();app.innerHTML=shellHTML()+'<div style="margin-top:12px">'+body+'</div>'+(s.phase==='season_end'&&tab==='overview'?'<section class="card" style="margin-top:12px;border-color:#947c4b"><div class="eyebrow">Season Review</div><h2>赛季结算 · '+s.year+'</h2><p>'+s.lastSummary.points+' 分 · '+s.lastSummary.goals+' 球 · '+s.lastSummary.assists+' 助攻 · 场均 '+s.lastSummary.average+'</p><p class="warning">'+(s.lastSummary.won?'🏆 联赛夺冠 · ':'')+(s.lastSummary.cup?'🏆 杯赛冠军 · ':'')+(s.lastSummary.scoring?'🏅 赛季金靴':'')+'</p>'+mainButtons()+'</section>':'');}
$('app').addEventListener('submit',e=>{if(e.target.id!=='startForm')return;e.preventDefault();s=createPlayer(new FormData(e.target));addLog(s,'16岁从 '+s.club+' 青训队开启职业生涯。');tab='overview';commit();});
$('app').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;let newTab=b.dataset.tab;if(newTab){tab=newTab;render();return;}let action=b.dataset.action,i=Number(b.dataset.index||0);if(!action)return;switch(action){case 'start-match':startMatch();break;case 'resolve':if(s.phase==='moment')completeMatch(i);break;case 'train':doTrain(b.dataset.value);break;case 'story':resolveStory(i);break;case 'auto-week':fastThree();break;case 'auto-season':autoSeason();break;case 'roll-talent':rolledTalent=freshTalent();render();break;case 'europe-next':simulateEuropeRound();commit();break;case 'europe-all':simulateEuropeAll();break;case 'next-season':nextSeason();break;case 'sign':doSign(i);break;case 'renew':doRenew();break;case 'recalibrate-history':recalibrateHistory();break;case 'restore-history':restoreHistoryStats();break;case 'export':exportSave();break;case 'import':$('fileUpload').click();break;case 'restart':if(confirm('确定清除当前生涯并重新开始？建议先导出存档。')){localStorage.removeItem(KEY);s=null;tab='overview';render();}break;}});
$('app').addEventListener('change',e=>{if(e.target.id==='leagueSelect'&&!s){const node=$('academySelect');if(node){node.innerHTML=youthClubs(e.target.value).map(c=>'<option>'+esc(c.name)+'</option>').join('');}}});
$('fileUpload').addEventListener('change',e=>{importSave(e.target.files[0]);e.target.value='';});
try{let data=JSON.parse(localStorage.getItem(KEY));if(defCheck(data)){s=ensureLegacy(data);if(!s.leagueTable)s.leagueTable=buildLeague(s);}else{s=startUnitedSave();save();}}catch(e){s=startUnitedSave();save();}render();
})();
</script></body></html>
