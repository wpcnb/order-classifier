<!doctype html><html lang='zh-CN'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>绿茵传奇</title><style>body{margin:0;background:#081b19;color:#e9f6ef;font:16px system-ui}main{max-width:760px;margin:auto;padding:22px}h1{color:#8df5b5}section{background:#12352d;border:1px solid #346c56;border-radius:18px;padding:18px;margin:14px 0}button,input,select{font:inherit;border-radius:10px;padding:12px;margin:5px;background:#e3ffec;color:#103427;border:0}button{cursor:pointer}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:#204c3b;padding:12px;border-radius:12px}small{color:#b5d5c7}#history{max-height:220px;overflow:auto}label{display:block;margin:8px 0}</style><main><h1>⚽ 绿茵传奇</h1><p>从青训少年到足坛传奇 · 足球生涯模拟器</p><section id='setup'><h2>创建球员</h2><label>球员姓名 <input id='name' maxlength='18' value='绿茵新星'></label><label>位置 <select id='pos'><option>前锋</option><option>中场</option><option>后卫</option><option>门将</option></select></label><button id='start'>开启生涯</button></section><section id='game' hidden><h2 id='headline'></h2><div class='grid' id='stats'></div><h3 id='event'></h3><div id='choices'></div><p id='result'></p><h3>生涯履历</h3><div id='history'></div><button id='reset'>重新开始</button></section></main><script>const $=id=>document.getElementById(id);let s;const clubs=['青训学院','成都雄狮','上海海港','阿贾克斯','多特蒙德','曼联','皇家马德里'];const events=[['教练建议你加强训练',['刻苦加练','保持体能','钻研战术']],['一家俱乐部向你发来邀请',['接受转会','留队争取主力','再等更好报价']],['媒体希望采访你',['积极回应','专注比赛','保持低调']],['关键比赛即将开始',['主动承担责任','稳健发挥','尝试大胆突破']],['赛季休整期到了',['强化射门','提升身体','恢复状态']]];function save(){localStorage.setItem('football-career-v1',JSON.stringify(s))}function draw(){ $('setup').hidden=true;$('game').hidden=false;$('headline').textContent=s.name+' · '+s.age+'岁 · '+s.club;$('stats').innerHTML=Object.entries({位置:s.pos,能力:s.skill,体能:s.fitness,名气:s.fame,出场:s.apps,进球:s.goals,助攻:s.assists,冠军:s.trophies}).map(([k,v])=>'<div class="stat"><small>'+k+'</small><br><strong>'+v+'</strong></div>').join('');$('history').innerHTML=s.log.slice(-12).reverse().map(x=>'<p>'+x+'</p>').join('');if(s.age>=38){$('event').textContent='职业生涯结束 · 传奇评分 '+Math.min(100,Math.round(s.skill*.5+s.fame*.3+s.trophies*4));$('choices').innerHTML='';$('result').textContent='退役：'+s.apps+'场，'+s.goals+'球，'+s.assists+'助攻，'+s.trophies+'冠';return}let e=events[s.age%events.length];$('event').textContent=e[0];$('choices').innerHTML='';e[1].forEach((c,i)=>{let b=document.createElement('button');b.textContent=c;b.onclick=()=>advance(i);$('choices').append(b)});$('result').textContent='每次选择推进一个赛季。'}function advance(i){let year=s.age,seed=(year*17+i*13+s.skill)%29;s.skill=Math.min(99,Math.max(30,s.skill+(i===0?4:i===1?2:1)-(year>31?3:0)));s.fitness=Math.min(99,Math.max(25,s.fitness+(i===1?3:-1)-(year>33?3:0)));s.fame=Math.min(99,s.fame+Math.floor(s.skill/22)+(i===0?2:0));let apps=Math.max(0,Math.round((s.skill+s.fitness)/5-8+seed%12));let goals=s.pos==='门将'?0:s.pos==='后卫'?Math.floor(apps/15):s.pos==='中场'?Math.floor(apps/6):Math.floor(apps/3.5);goals=Math.max(0,goals+seed%5-2);let assists=s.pos==='门将'?0:Math.max(0,Math.floor(apps/(s.pos==='中场'?5:11))+seed%3-1);s.apps+=apps;s.goals+=goals;s.assists+=assists;let champ=s.skill>72&&seed%5===0;if(champ)s.trophies++;if(i===0&&s.skill>65&&s.club!==clubs[clubs.length-1])s.club=clubs[Math.min(clubs.length-1,Math.floor(s.skill/15))];s.log.push(year+'岁｜'+s.club+'｜'+apps+'场 '+goals+'球 '+assists+'助'+(champ?'｜🏆夺冠':''));s.age++;save();draw()}$('start').onclick=()=>{s={name:$('name').value.trim()||'绿茵新星',pos:$('pos').value,age:12,club:clubs[0],skill:42,fitness:68,fame:0,apps:0,goals:0,assists:0,trophies:0,log:[]};save();draw()};$('reset').onclick=()=>{localStorage.removeItem('football-career-v1');location.reload()};try{s=JSON.parse(localStorage.getItem('football-career-v1'));if(s&&s.log&&s.name)draw()}catch(e){}</script></html>
