function currentFootballAge(dob,year){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(dob||''))return null;
 const parts=dob.split('-').map(Number);
 return year-parts[0]-((parts[1]*100+parts[2])>1101?1:0)
}
function makeVerifiedYouth(row,i){
 const [name,club,position,dob,rating,potential,english,source]=row;
 const year=Number(dob.slice(0,4)),league=Object.keys(LEAGUE_DB).find(id=>LEAGUE_DB[id].teams.some(t=>t.name===club))||'INT';
 return {id:'youth-'+i,lineageKey:'youth-'+i,lineageGeneration:1,
  name,originalName:name,englishName:english,club,league,
  pos:position,baseOverall:rating,overall:rating,potential,birthYear:year,bornOn:dob,
  age:currentFootballAge(dob,2026),apps:0,goals:0,assists:0,form:56,
  realPerson:true,isYouth:true,retired:false,authentic:true,reference:source}
}

function verifiedBirthYear(name,rosterAge){return name==='姆巴佩'?1998:name==='梅西'?1987:name==='C罗'?1985:2026-rosterAge}
function retirementAge(n){
 const key=String(n.lineageKey||n.id||'player');
 const h=[...key].reduce((a,x)=>(a*33+x.charCodeAt(0))%9973,17);
 return (n.pos==='GK'?38:35)+h%(n.pos==='GK'?5:5);
}

function reconcileRealPlayer(n,person,i,year){
 n.realPerson=true;n.lineageKey=n.lineageKey||'real-'+i;n.lineageGeneration=1;
 n.baseOverall=person[3];n.potential=n.potential||Math.max(82,person[3]);
 n.birthYear=verifiedBirthYear(person[0],person[4]);n.originalName=person[0];
 if(n.retired)return;
 n.age=Math.max(16,(n.startAge||person[4])+(year-(n.debutYear||2026)));
 if(n.age>=retirementAge(n)){n.retired=true;n.retiredAt=n.retiredAt||year;return}
 const late=Math.max(0,n.age-30);
 const cap=clamp(Math.round(n.baseOverall+Math.max(0,26-n.age)*.12-Math.pow(late,1.34)*1.65),36,99);
 n.overall=clamp(Math.min(n.overall||cap,cap),35,99)
}

function retireRealPlayersForNewSeason(state){
 const year=state.year;
 for(const n of (state.npcs||[])){
  if(!n.realPerson||n.retired)continue;
  const age=n.age||20;
  if(age>=retirementAge(n)||age>=34&&rnd()<clamp((age-33)*.055,0,.37)){
   n.retired=true;n.retiredAt=year;recordFootballRetirement(state,n)
  }
 }
}

function npcSeasonTransition(n,year){
 if(n.realPerson)return;
 n.age=Math.max(16,Math.min(43,(n.age||randint(19,29))+1));
 if(n.age>37||n.overall<41){
   n.age=randint(17,20);
   n.overall=randint(52,72);
   n.id='academy-'+year+'-'+String(n.id);
   n.retired=false;
 }else if(n.age<25){n.overall=clamp(n.overall+randint(0,2),42,94)}
 else if(n.age>31){n.overall=clamp(n.overall-randint(0,2),40,92)}
 else n.overall=clamp(n.overall+randint(-1,1),42,95);
}

function recordFootballRetirement(state,n){
 state.footballRetirements=state.footballRetirements||[];
 if(state.footballRetirements.some(x=>x.id===n.id||x.name===n.name&&x.year===n.retiredAt))return;
 state.footballRetirements.push({id:n.id,name:n.name,age:n.age,year:n.retiredAt||state.year,club:n.club,
   generation:n.lineageGeneration||1,originalName:n.originalName||n.name});
 state.footballRetirements=state.footballRetirements.slice(-350)
}
function seasonImproveAcademyPlayers(state){
 for(const n of (state.npcs||[])){
  if(!n.realPerson||n.retired)continue;
  if(n.isYouth||n.rebirth){
    const cap=n.potential||90,age=n.age||20;
    const step=age<=19?randint(1,4):age<=23?randint(1,3):age<=27?randint(0,2):0;
    const breakthrough=age<=22&&n.overall<cap-10&&rnd()<.10?2:0;
    n.overall=clamp(n.overall+step+breakthrough,35,cap);
    n.lastDevelopedYear=state.year
  }else if(n.age<25&&rnd()<.40){
    n.overall=Math.min((n.potential||n.baseOverall||90)+1,n.overall+1)
  }
 }
}
/* Distinct second/third generations are fictional footballers that inherit an
   original real athlete's name, playing position and potential range, but NEVER
   career statistics or award history. Source real athlete stays permanently retired. */
function reincarnateRealPlayers(state){
 if(!state?.npcs)return [];
 const year=Number(state.year)||2026;
 state.worldRebirthCount=Math.max(state.worldRebirthCount||0,(state.worldRebirths||[]).length);
 const byLineage=new Map();
 for(const n of state.npcs){
  if(!n.realPerson)continue;
  n.lineageKey=n.lineageKey||n.id;
  const k=n.lineageKey,old=byLineage.get(k);
  if(!old||(n.lineageGeneration||1)>(old.lineageGeneration||1))byLineage.set(k,n)
 }
 const born=[];
 for(const [lineage,ancestor] of byLineage){
  if(!ancestor.retired||(ancestor.retiredAt||year)>=year)continue;
  const generation=(ancestor.lineageGeneration||1)+1;
  const id='rebirth-'+lineage+'-g'+generation;
  if(state.npcs.some(x=>x.id===id))continue;
  const hash=[...id].reduce((h,ch)=>(h*31+ch.charCodeAt(0))%1000003,97);
  const age=16+hash%2;
  const origin=ancestor.originalName||ancestor.name.split('·转世')[0];
  const initial=clamp(56+hash%14,52,73);
  const parentTalent=ancestor.potential||ancestor.baseOverall||88;
  const potential=clamp(Math.round(parentTalent*.92+((Math.floor(hash/13)%9)-3)),81,98);
  const record={id,name:origin+'·转世第'+generation+'代',originalName:origin,
    englishName:ancestor.englishName||'',club:ancestor.club,league:ancestor.league,pos:ancestor.pos,
    baseOverall:initial,overall:initial,potential,age,rebirth:true,
    rebirthYear:year,rebirthStartAge:age,birthYear:year-age,bornOn:null,retired:false,
    realPerson:true,authentic:false,isYouth:false,lineageKey:lineage,lineageGeneration:generation,
    apps:0,goals:0,assists:0,form:56};
  state.npcs.push(record);
  const logRecord={year,name:record.name,from:ancestor.name,club:record.club,age,generation,potential,originalName:origin};
  (state.worldRebirths||(state.worldRebirths=[])).push(logRecord);
  born.push(logRecord)
 }
 state.worldRebirths=(state.worldRebirths||[]).slice(-400);
 state.worldRebirthCount+=born.length;
 return born
}

function syncRealPlayerAges(state){
 if(!state||!Array.isArray(state.npcs))return;
 const year=Number(state.year)||2026;
 const originals=REAL_AWARD_DATA.roster;
 const youthById=new Map(VERIFIED_YOUTH_2026.map((row,i)=>['youth-'+i,row]));
 for(const n of state.npcs){
  if(!n.realPerson||n.retired)continue;
  const wasRetired=!!n.retired;
  if(n.rebirth){
    n.age=(n.rebirthStartAge||16)+year-(n.rebirthYear||year);
    if(n.age>=retirementAge(n)){n.retired=true;n.retiredAt=year}
    else if(n.age>30){
      const cap=clamp(Math.round(n.potential-Math.pow(n.age-30,1.3)*1.8),38,99);
      n.overall=Math.min(n.overall,cap)
    }
  }else if(n.isYouth||String(n.id).startsWith('youth-')){
    const row=youthById.get(n.id);
    if(row){
      n.isYouth=true;n.authentic=true;n.bornOn=row[3];n.birthYear=Number(row[3].slice(0,4));
      n.potential=n.potential||row[5];n.baseOverall=n.baseOverall||row[4];
      n.lineageKey=n.lineageKey||n.id;n.lineageGeneration=1;n.originalName=n.originalName||row[0];
    }
    n.age=currentFootballAge(n.bornOn,year)??Math.max(16,year-(n.birthYear||2009));
    // When a long-running save imports newly added real teenagers,
    // retroactively provide age-appropriate development without rewriting old results.
    if(n.lastDevelopedYear===undefined&&year>2026){
      n.overall=clamp(Math.max(n.overall,n.baseOverall+Math.min(30,Math.max(0,year-2026)*2)),35,n.potential||91);
      n.lastDevelopedYear=year
    }
    if(n.age>=retirementAge(n)){n.retired=true;n.retiredAt=year}
  }else{
    const match=String(n.id).match(/^real-(\d+)$/);
    if(match&&originals[Number(match[1])])reconcileRealPlayer(n,originals[Number(match[1])],Number(match[1]),year);
    else {
      const idx=originals.findIndex(p=>p[0]===n.name);
      if(idx>=0)reconcileRealPlayer(n,originals[idx],idx,year);
      else {n.retired=true;n.retiredAt=year}
    }
  }
  if(!wasRetired&&n.retired)recordFootballRetirement(state,n)
 }
}

function ensureRealAwardRoster(state){

 const byName=new Map(state.npcs.filter(n=>n.realPerson).map(n=>[n.name,n]));
 REAL_AWARD_DATA.roster.forEach((person,i)=>{
   if(byName.has(person[0]))return;
   const existing=state.npcs.find(n=>n.name===person[0]);
   if(existing){existing.realPerson=true;existing.age=existing.age||person[4];return}
   state.npcs.push(realPlayerNPC(person,i))
 });
 VERIFIED_YOUTH_2026.forEach((row,i)=>{
   const id='youth-'+i;
   if(state.npcs.some(n=>n.id===id||n.name===row[0]&&!n.rebirth))return;
   state.npcs.push(makeVerifiedYouth(row,i))
 });
}

function simulateEuropeRound(){

  const power=clubPower(s.club),opponent=game.home===s.club?game.away:game.home,other=clubPower(opponent);
  const our=clamp(Math.floor(1.5+(power-other)/30+rnd()*2),0,5);
  const them=clamp(Math.floor(1.2+(other-power)/31+rnd()*2),0,5);
  game.hs=game.home===s.club?our:them;game.as=game.home===s.club?them:our;
  e.pts+=our>them?3:our===them?1:0;e.gf+=our;e.ga+=them;e.played++;

  addLog(s,e.name+'：'+game.home+' '+game.hs+' : '+game.as+' '+game.away+'（游戏赛季结果）');

   if(e.place>24){e.completed=true;e.phase='eliminated';}
   else{e.phase='knockout';e.knockouts=[];}
  }

 }
 if(e.phase==='knockout'){

  let roundNames=e.place<=8?['十六强','八强','半决赛','决赛']:['附加赛','十六强','八强','半决赛','决赛'];

 }

}

function randomPoisson(lambda){
 const expected=clamp(Number(lambda)||0,.02,5.8);
 let stop=Math.exp(-expected),k=0,p=1;
 do{k++;p*=rnd()}while(p>stop&&k<12);
 return clamp(k-1,0,9);
}

function recalibrateHistory(){

 const caps={ST:{g:.92,a:.48},LW:{g:.69,a:.63},CM:{g:.31,a:.75},CB:{g:.13,a:.28},GK:{g:.025,a:.045}};

 const oldGoals=old.reduce((z,y)=>z+(Number(y.goals)||0),0),oldAssists=old.reduce((z,y)=>z+(Number(y.assists)||0),0);
 const correct=(y)=>{let apps=Math.max(0,Number(y.apps)||0);return {
   ...y,goals:Math.min(Number(y.goals)||0,Math.min(72,Math.round(apps*cfg.g))),
   assists:Math.min(Number(y.assists)||0,Math.min(48,Math.round(apps*cfg.a))),balanced:true
 }};
 const revised=old.map(correct),newGoals=revised.reduce((z,y)=>z+y.goals,0),newAssists=revised.reduce((z,y)=>z+y.assists,0);
 const currentApps=Math.max(0,Number(current.apps)||0);
 const currentGoals=Math.min(current.goals||0,Math.min(72,Math.round(currentApps*cfg.g))),currentAssists=Math.min(current.assists||0,Math.min(48,Math.round(currentApps*cfg.a)));

   apps:before.apps,goals:Math.max(0,oldTotal.goals-oldGoals-(current.goals||0))+newGoals+currentGoals,
   assists:Math.max(0,oldTotal.assists-oldAssists-(current.assists||0))+newAssists+currentAssists

function simulateNPCWeek(teamGoals=0,playerGoals=0,playerAssists=0){
 const ns=s.npcs;if(!Array.isArray(ns))return;
 ns.forEach(n=>{
   if(n.retired||n.club===s.club)return;
   const quality=clamp((n.overall-60)/100,0,.40);
   const role={ST:.32,LW:.23,CM:.095,CB:.022,GK:.001}[n.pos]||.12;
   const assist={ST:.13,LW:.22,CM:.27,CB:.06,GK:.004}[n.pos]||.14;
   const appearanceChance=n.age<18?.35:n.age<20?.67:n.age<23?.84:.89;
   if(rnd()<appearanceChance){n.apps++;
    const goals=randomPoisson(clamp((role+quality*.36)*(n.pos==='GK'?.05:1),.001,.95));
    n.goals+=Math.min(goals,3);
    n.assists+=Math.min(randomPoisson(assist+quality*.11),2);
   }
   n.form=clamp(n.form+randint(-4,5),0,100);
 });
 const mates=ns.filter(n=>n.club===s.club&&!n.retired);
 const field=mates.filter(n=>rnd()<.88);
 const eligible=field.length?field:mates;
 eligible.forEach(n=>n.apps=(n.apps||0)+1);
 for(let g=0;g<Math.max(0,teamGoals-playerGoals);g++)if(eligible.length){const p=pick(eligible);p.goals=(p.goals||0)+1;}
 for(let a=0;a<Math.max(0,teamGoals-playerGoals-playerAssists);a++)if(eligible.length&&rnd()<.72){const p=pick(eligible);p.assists=(p.assists||0)+1;}
}

function simulateLeague(ourOpp){
 const rounds=s.leagueRounds||[],fixtures=rounds[s.week-1];
 const sim=(a,b)=>{
   const diff=clubPower(a)-clubPower(b);
   return [randomPoisson(clamp(1.36*Math.exp(diff/91),.32,3.15)),
           randomPoisson(clamp(1.10*Math.exp(-diff/91),.26,2.95))]
 };
 if(fixtures){
  for(const g of fixtures){if(g.home===s.club||g.away===s.club)continue;
   const [ha,aa]=sim(g.home,g.away);applyScore(g.home,g.away,ha,aa)}
  return;
 }
 const remaining=Object.keys(s.leagueTable).filter(c=>c!==s.club&&c!==ourOpp);
 remaining.sort(()=>rnd()-.5);
 for(let i=0;i+1<remaining.length;i+=2){
  const [ha,aa]=sim(remaining[i],remaining[i+1]);applyScore(remaining[i],remaining[i+1],ha,aa)
 }
}

 ['耐克','equipment',65,230000,3],['阿迪达斯','equipment',65,225000,3],['彪马','equipment',48,150000,3],
 ['新百伦','equipment',32,95000,2],['斯凯奇','equipment',29,84000,2],['李宁','equipment',19,66000,2],
 ['安踏','equipment',16,61000,2],['特步','equipment',8,37000,2],['匹克','equipment',7,33000,2],
 ['百事可乐','commercial',75,190000,2],['可口可乐','commercial',75,195000,2],

];
function sponsorType(category){return category==='equipment'?'球鞋与装备独家':'商业推广'}
function sponsorFreeSlots(player,kind){
 const count=(player.sponsorships||[]).filter(x=>x.category===kind&&x.endYear>player.year).length;
 return Math.max(0,(kind==='equipment'?1:2)-count)
}
function refreshSponsorOffers(player){
 if(!player||player.retired)return;
 const fame=ratio(player.fame||0),overallPower=over(player),gold=(player.awards||[]).filter(a=>String(a.title).includes('金球奖')).length;
 const candidates=SPONSOR_BRANDS.filter(b=>fame>=b[2]&&sponsorFreeSlots(player,b[1])>0&&
     !(player.sponsorships||[]).some(x=>x.name===b[0]&&x.endYear>player.year));
 const offers=candidates.map(b=>({name:b[0],category:b[1],minFame:b[2],years:b[4],
   annual:Math.max(12000,Math.round(b[3]*(.64+fame/140)*(.68+overallPower/170)*(1+Math.min(4,gold)*.10)/1000)*1000),
   year:player.year}));
 player.sponsorOffers=['equipment','commercial'].flatMap(kind=>
   offers.filter(o=>o.category===kind).sort((a,b)=>b.annual-a.annual).slice(0,4))
}
function signSponsor(index){
 if(s.retired)return;
 const offer=(s.sponsorOffers||[])[index];
 if(!offer||offer.year!==s.year){refreshSponsorOffers(s);commit();return notice('合作报价已更新')}
 if(!sponsorFreeSlots(s,offer.category))return notice('该类别合作名额已满');
 const signing=Math.round(offer.annual*.2/1000)*1000;
 s.sponsorships.push({name:offer.name,category:offer.category,annual:offer.annual,
   startYear:s.year,endYear:s.year+offer.years,years:offer.years,settledYears:[]});
 s.cash+=signing;s.sponsorIncomeTotal+=signing;s.seasonTotals.sponsorIncome=(s.seasonTotals.sponsorIncome||0)+signing;
 s.sponsorLedger.push({year:s.year,name:offer.name,type:'签约奖金',amount:signing});
 addLog(s,'与'+offer.name+'签署'+offer.years+'季'+sponsorType(offer.category)+'合同，签约奖金'+money(signing));
 if(s.pendingDecision?.type==='sponsor')s.pendingDecision=null;refreshSponsorOffers(s);commit();notice('签约成功：获得'+money(signing))
}
function settleSponsors(){
 s.sponsorIncomeTotal=s.sponsorIncomeTotal||0;s.seasonTotals.sponsorIncome=s.seasonTotals.sponsorIncome||0;
 for(const c of (s.sponsorships||[])){
  if(s.year<c.startYear||s.year>=c.endYear||(c.settledYears||[]).includes(s.year))continue;
  const performance=s.seasonTotals.goals>=20?.10:0;
  const wonGold=s.awards.some(x=>x.year===s.year&&String(x.title).includes('金球奖'));
  const bonus=Math.round(c.annual*(performance+(wonGold?.22:0)));
  const moneyEarned=c.annual+bonus;
  s.cash+=moneyEarned;s.sponsorIncomeTotal+=moneyEarned;s.seasonTotals.sponsorIncome+=moneyEarned;
  (c.settledYears||(c.settledYears=[])).push(s.year);
  s.sponsorLedger.push({year:s.year,name:c.name,type:'年度结算',amount:moneyEarned,bonus});
  addLog(s,c.name+'年度合作收入'+money(moneyEarned)+(bonus?'（含成绩奖金）':''));
 }
 s.sponsorLedger=s.sponsorLedger.slice(-80)
}

 const appeared=!s.retired&&s.selfSelected!==false&&!wasInjured&&rnd()<clamp(.52+(o-baseTeam)/125+s.manager/330+(s.form-50)/310-(phys<30?.18:0),.30,.95);
 const success=appeared&&selected&&rnd()<matchChance(option);
 const strength=baseTeam-opp.strength;
 const focus=success?1.07:1;
 const offense=clamp(1.30*Math.exp(strength/90)*focus*(s.playerManagerMode&&s.coachTactic==='attack'?1.17:s.playerManagerMode&&s.coachTactic==='defend'?.88:1),.28,3.15);
 const defense=clamp(1.12*Math.exp(-strength/110)*(success?.96:1)*(s.playerManagerMode&&s.coachTactic==='defend'?.82:s.playerManagerMode&&s.coachTactic==='attack'?1.13:1),.25,3.05);
 let homeScore=randomPoisson(offense),awayScore=randomPoisson(defense);
 let goals=0,assists=0,clean=0,saves=0;
 if(appeared){
   const rate=seasonPlayerRate(s)*(success?1.16:1)*(s.difficulty==='hard'?.85:s.difficulty==='easy'?1.11:1);
   goals=Math.min(homeScore,randomPoisson(rate));
   assists=Math.min(Math.max(0,homeScore-goals),randomPoisson(assistRate(s)*(success?1.12:1)));
   clean=awayScore===0?1:0;
   saves=s.pos==='GK'?randint(1,7):0;
   if(success&&s.pos==='GK'&&awayScore>0&&rnd()<.20){awayScore--;clean=awayScore===0?1:0}
 }
let rating=appeared?clamp(5.6+(success?.65:-.05)+(goals*.85)+(assists*.5)+(homeScore>awayScore?.35:homeScore===awayScore?.1:-.3)+(rnd()-.5)*1.1,4.2,9.9):0;rating=Math.round(rating*10)/10;
const t=s.seasonTotals;t.w+=homeScore>awayScore?1:0;t.d+=homeScore===awayScore?1:0;t.l+=homeScore<awayScore?1:0;t.points+=homeScore>awayScore?3:homeScore===awayScore?1:0;t.gf+=homeScore;t.ga+=awayScore;if(!s.leagueTable)s.leagueTable=buildLeague(s);const fixture=s.leagueRounds?.[s.week-1]?.find(m=>m.home===s.club||m.away===s.club);if(fixture&&fixture.away===s.club)applyScore(opp.name,s.club,awayScore,homeScore);else applyScore(s.club,opp.name,homeScore,awayScore);simulateLeague(opp.name);simulateNPCWeek(homeScore,goals,assists);
if(appeared){t.apps++;t.goals+=goals;t.assists+=assists;t.clean+=clean;t.saves+=saves;t.ratings.push(rating);s.totals.apps++;s.totals.goals+=goals;s.totals.assists+=assists;s.totals.clean+=clean;s.totals.saves+=saves;s.form=ratio(s.form+(rating-6.5)*4);s.manager=ratio(s.manager+(rating-6.5)*2.5);s.fame=ratio(s.fame+(rating>=8?2:0));}
const staminaLoss=wasInjured?0:randint(7,16)+(selected&&option===1?4:0);s.stamina=ratio(s.stamina-staminaLoss+randint(6,12));s.morale=ratio(s.morale+(homeScore>awayScore?4:homeScore===awayScore?0:-4));s.cash+=s.salary;s.trainingUsed=false;
if(s.injury)s.injury--;else if(appeared&&phys<38&&rnd()<.13){s.injury=randint(1,3);addLog(s,'赛后出现肌肉伤势，预计缺阵 '+s.injury+' 场。');if(s.injury>=2)s.pendingDecision={type:'injury',text:'你遭遇伤病，需要作出康复选择。'};}
let desc=s.club+' '+homeScore+' : '+awayScore+' '+opp.name+'，'+(appeared?'个人评分 '+rating+'，'+goals+'球 '+assists+'助攻':'本场未登场')+(success?'；关键时刻判断正确':'');s.lastResult=desc;addLog(s,desc);
if(s.week===8&&!s.retired&&s.age>=18&&o>=60&&s.fame>=22){let caps=1;s.totals.national+=caps;t.national+=caps;if(rnd()<(.09+o/700)&&s.pos!=='GK'){s.totals.nationalGoals++;}addLog(s,'获得 '+s.country+' 国家队征召，新增 '+caps+' 次出场。');}
s.week++;s.match=null;s.nextOpp=null;s.phase='prep';if(s.week>s.fixtures){endSeason();}else{if([3,6,10,13].includes(s.week)&&!s.storyKeys.includes(s.season+'-'+s.week)){s.storyKeys.push(s.season+'-'+s.week);s.story={index:randint(0,STORIES.length-1)};}}
commit();}
function endSeason(){let t=s.seasonTotals,o=over(s),rank=standings().findIndex(x=>x.name===s.club)+1,won=rank===1&&t.points>=18;let cup=t.points>=24&&rnd()<.30;let leagueLeader=Math.max(0,...s.npcs.filter(n=>n.league===s.leagueId).map(n=>n.goals||0));let bootRanking=seasonGoldenBootRanking();let scoring=s.pos!=='GK'&&bootRanking.eligible&&bootRanking.rank===1&&t.goals>=7;let average=t.ratings.length?t.ratings.reduce((a,b)=>a+b,0)/t.ratings.length:0;
if(won){s.awards.push({year:s.year,type:'title',title:leagueName(s)+'冠军'});s.cash+=120000;s.fame=ratio(s.fame+9);}if(cup){s.awards.push({year:s.year,type:'title',title:'国内杯赛冠军'});s.cash+=40000;s.fame=ratio(s.fame+5);}if(scoring){s.awards.push({year:s.year,type:'personal',title:leagueName(s)+'金靴奖'});s.cash+=18000;s.fame=ratio(s.fame+8);}if(average>=7.85&&t.apps>=Math.min(16,s.fixtures*.45)){s.awards.push({year:s.year,type:'personal',title:'赛季最佳球员'});s.fame=ratio(s.fame+8);}if(s.year%4===2&&s.age>=20&&s.totals.national>=3){let n=rnd();if(n<.13+o/700){s.awards.push({year:s.year,type:'title',title:'国家队洲际冠军'});s.fame=ratio(s.fame+12);}}
if(s.europe&&!s.europe.completed){let attempts=0;while(attempts++<14&&!s.europe.completed)simulateEuropeRound();}if(!s.retired)ballonVote();settleSponsors();const b=s.retired?null:s.ballots[s.ballots.length-1];
s.history.push({year:s.year,club:s.club,league:leagueName(s),apps:t.apps,goals:t.goals,assists:t.assists,points:t.points,won,rank,
   ballonRank:b?.playerRank??null,ballonNominated:!!b?.playerNominated,ballonWinner:b?.winner?.name||null,
   ballonPoints:b?.playerPoints||0,goldenBootRank:bootRanking.eligible?bootRanking.rank:null,
   goldenBootLeader:bootRanking.leader.name,goldenBootLeaderGoals:bootRanking.leader.goals,
   sponsorIncome:t.sponsorIncome||0});
if(s.age>32){if(rnd()<.75)s.stats.pace=ratio(s.stats.pace-randint(0,2));if(rnd()<.6)s.stats.physical=ratio(s.stats.physical-1);if(rnd()<.25)s.stats.mental=ratio(s.stats.mental+1)}
 else {const potential=Math.max(s.talent?.potential||85,...Object.values(s.stats));const main=s.pos==='ST'?'shoot':s.pos==='LW'?'shoot':s.pos==='CM'?'pass':s.pos==='CB'?'defense':'mental';if(s.stats[main]<potential&&rnd()<.7)s.stats[main]++;if(s.age<=23&&s.stats.mental<potential&&rnd()<.4)s.stats.mental++}if(s.age>32)s.stamina=ratio(s.stamina-3);s.cash+=t.points*950;
s.lastSummary={won,cup,scoring,average:average.toFixed(2),points:t.points,goals:t.goals,assists:t.assists,ballonRank:b?.playerRank??null,bootRank:bootRanking.rank,sponsorIncome:t.sponsorIncome||0,teamLeaders:teamLeaders()};s.phase='season_end';s.offers=generateOffers();addLog(s,'赛季结束：'+t.points+'分'+(won?'，荣膺联赛冠军':'')+(cup?'，捧得杯赛冠军':'')+'。');tab='overview';}
function generateOffers(){
 if(s.tier===0)return [{club:s.club.replace(/青训$/,''),leagueId:s.leagueId,years:3,salary:6500,stage:'senior',promotion:true,role:'一线队轮换',fee:0}];
 const overall=over(s),gold=(s.awards||[]).filter(a=>String(a.title||'').includes('金球奖')).length;
 const elite=gold>=1||overall>=86;
 const min=elite?80:Math.max(40,overall-18);
 const all=Object.entries(LEAGUE_DB).flatMap(([id,d])=>d.teams.map(c=>({...c,leagueId:id})));
 const choices=all.filter(c=>c.name!==s.club&&c.strength>=min&&c.strength<=overall+22);
 return choices.sort(()=>rnd()-.5).slice(0,5).map(c=>{
  const role=c.strength>overall+6?'重要轮换':c.strength>overall-4?'竞争首发':'核心球员';
  const salary=Math.round(clamp((Math.pow(c.strength/75,6)*85000+overall*500+s.fame*400)*(.85+rnd()*.35),3000,700000)/1000)*1000;
  return {club:c.name,leagueId:c.leagueId,years:randint(2,5),salary,role,fee:Math.round(value(s)*(.9+rnd()*.3)/1000000)*1000000,stage:'senior'};
 });
}
function nextSeason(){
 if(!s||s.phase!=='season_end')return;
 if(s.tier===0){const old=s.club;s.club=s.club.replace(/青训$/,'');s.tier=1;s.salary=Math.max(6000,s.salary);addLog(s,'从'+old+'升入'+s.club+'一线队。');}
 s.age++;s.year++;s.season++;s.week=1;s.contract=Math.max(0,s.contract-1);s.pendingDecision=null;s.phase='prep';s.trainingUsed=false;s.story=null;s.storyKeys=[];s.seasonTotals=newSeasonTotals();
 s.schedule=makeSchedule(s);s.leagueTable=buildLeague(s);s.nextOpp=null;s.offers=[];s.tournaments=null;s.stamina=ratio(Math.max(s.stamina,78));s.morale=ratio(s.morale+6);s.form=ratio(s.form+4);s.europe=buildEurope(s);
 const expired=(s.sponsorships||[]).filter(x=>x.endYear<=s.year);
 s.sponsorHistory=s.sponsorHistory||[];s.sponsorHistory.push(...expired.map(x=>({...x})));
 s.sponsorships=(s.sponsorships||[]).filter(x=>x.endYear>s.year);
 ensureRealAwardRoster(s);s.npcs.forEach(n=>{n.apps=0;n.goals=0;n.assists=0;n.form=0;if(!n.realPerson)npcSeasonTransition(n,s.year);});
 syncRealPlayerAges(s);seasonImproveAcademyPlayers(s);retireRealPlayersForNewSeason(s);reincarnateRealPlayers(s);refreshSponsorOffers(s);
 if(s.age>=35&&!s.playerManagerMode){s.playerManagerMode=true;s.coachCareer=true;s.selfSelected=true;addLog(s,'35岁：自动担任球员兼主教练，可安排自己首发或休息。');}
 if(s.age>=40&&!s.retired)retire();
 if(!s.retired&&s.contract===0){s.pendingDecision={type:'contract',text:'职业球员合同到期，请先与俱乐部谈续约。'};}
 else if(expired.length&&!s.retired){s.pendingDecision={type:'sponsor',text:expired.map(x=>x.name).join('、')+'代言到期，经纪人已有新的报价。'};}
 else if(!s.retired&&!s.sponsorships.length&&(s.sponsorOffers||[]).length){s.pendingDecision={type:'sponsor',text:'你目前没有个人代言，经纪人已自动找到报价。'};}
 addLog(s,'新的赛季开始。');commit();
}
function retire(){
 if(s.retired)return;
 s.retired=true;s.playerManagerMode=true;s.coachCareer=true;s.selfSelected=false;s.playerRetiredAt=s.year;
 addLog(s,'40岁正式退役，保留球队主教练身份。今后可以继续执教。');
}
function doTrain(id){
 if(s.trainingUsed||s.phase!=='prep'||s.story)return;
 const t=DRILLS.find(x=>x.id===id);if(!t)return;
 if(s.stamina<t.cost+6){notice('体能不足，请先恢复');return}
 s.trainingProgress=s.trainingProgress||{};
 s.talent=s.talent||freshTalent();
 const potential=Math.max(s.talent.potential||85,...Object.values(s.stats));
 let upgraded=[];
 if(id!=='rest')for(const k in t.up){
   if(s.stats[k]>=potential)continue;
   const exp=(s.trainingProgress[k]||0)+(k===Object.keys(t.up)[0]?2:1);
   const threshold=s.age<=21?4:s.age<=29?6:9;
   if(exp>=threshold){s.stats[k]=clamp(s.stats[k]+1,0,potential);s.trainingProgress[k]=exp-threshold;upgraded.push(STAT_NAMES[k])}
   else s.trainingProgress[k]=exp;
 }
 s.stamina=ratio(s.stamina-t.cost);
 s.trainingUsed=true;s.manager=ratio(s.manager+(id==='rest'?1:2));
 addLog(s,'完成'+t.name+(upgraded.length?'，'+upgraded.join('、')+'提升1点':'，继续积累训练经验')+'。');
 commit();notice('本周训练完成'+(upgraded.length?'，能力有提升':''))
}

function resolveStory(index){if(!s.story)return;const event=STORIES[s.story.index],choice=event.choices[index];if(!choice)return;choice[1](s);for(const k in s.stats)s.stats[k]=ratio(s.stats[k]);['stamina','morale','fame','manager','form'].forEach(k=>s[k]=ratio(s[k]));addLog(s,'剧情「'+event.title+'」：'+choice[0]);s.story=null;commit();}
function doSign(i){let offer=s.offers[i];if(!offer||s.retired)return;if(s.tier===1&&offer.stage==='youth'){notice('一线队球员不能转回青训队。');return;}const old=s.club;if(!confirm('确认接受'+offer.club+'的合同？周薪'+money(offer.salary)+'、合同'+offer.years+'年。'))return;s.pendingDecision=null;s.club=offer.club;s.leagueId=offer.leagueId||leagueForClub(offer.club);s.tier=1;s.salary=offer.salary;s.contract=offer.years;s.manager=55;s.morale=ratio(s.morale+8);s.offers=[];s.nextOpp=null;s.fixtures=(teamList(s).length-1)*2;s.schedule=makeSchedule(s);s.leagueTable=buildLeague(s);addLog(s,'完成'+(offer.promotion?'青训升入一线队':'跨队转会')+'：'+old+' → '+s.club+'，周薪 '+money(s.salary)+'。');commit();notice('加入一线队：'+s.club);}
function doRenew(){if(s.retired)return;if(s.lastRenewSeason===s.season){notice('本赛季已经续约过一次');return;}if(s.contract>=4){notice('当前合同仍有较长时间，无需续约');return;}let raise=clamp(.06+(s.fame/100)*.20,.06,.25);s.salary=Math.round(s.salary*(1+raise)/100)*100;s.contract=3;s.lastRenewSeason=s.season;s.manager=ratio(s.manager+5);addLog(s,'与 '+s.club+' 续约至未来三年。');commit();notice('续约完成');}
function fastThree(){
 if(!s||s.phase==='season_end'||s.story||s.pendingDecision)return;
 batching=true;let played=0;
 try{
  while(played<3&&s.phase!=='season_end'&&!s.story&&!s.pendingDecision){
   if(s.phase==='moment'&&s.match){completeMatch(s.injury?-1:(s.pos==='GK'?2:0));played++;continue;}
   if(s.phase!=='prep')break;
   s.match={opp:opponent(),moment:'快速赛季推演'};s.phase='moment';
   completeMatch(s.injury?-1:(s.pos==='GK'?2:0));played++;
  }
 }finally{batching=false;}
 tab='overview';commit();notice('已完成 '+played+' 轮，当前进度 '+Math.min(s.week-1,s.fixtures)+'/'+s.fixtures);
}
function chooseAutoTraining(){
 if(s.stamina<65)return 'rest';
 const w={
  ST:{shoot:.48,pace:.12,pass:.12,mental:.16,physical:.12},
  LW:{shoot:.34,pace:.26,pass:.23,mental:.12,physical:.05},
  CM:{pass:.42,mental:.23,physical:.13,pace:.10,defense:.12},
  CB:{defense:.41,physical:.23,mental:.21,pace:.10,pass:.05},
  GK:{defense:.48,mental:.24,physical:.21,pass:.05,pace:.02}
 }[s.pos]||{shoot:.35,pass:.25,pace:.20,mental:.20};
 const potential=Math.max(s.talent?.potential||85,...Object.values(s.stats));
 const available=DRILLS.filter(x=>x.id!=='rest').map(d=>({id:d.id,weight:Object.keys(d.up).reduce((sum,k)=>sum+(w[k]||.01)*Math.max(0,potential-s.stats[k]),0)})).sort((a,b)=>b.weight-a.weight);
 return available[0]?.weight>0?available[0].id:'rest'
}
function autoSeason(){
 if(!s||s.phase==='season_end'||s.story||s.pendingDecision)return;
 const remaining=s.fixtures-s.week+1;
 if(!confirm('将自动赛季推演剩余 '+remaining+' 轮联赛，期间自动处理普通剧情与训练。结束后可以查看积分榜、奖项和转会报价。确定继续？'))return;
 let count=0;
 batching=true;
 try{
  while(count<Math.max(s.fixtures,44)&&s.phase!=='season_end'&&!s.story&&!s.pendingDecision){
   if(s.phase==='moment'&&s.match){completeMatch(s.injury?-1:(s.pos==='GK'?2:0));count++;continue;}
   if(s.phase!=='prep')break;
   if(!s.trainingUsed){let choice=chooseAutoTraining();doTrain(choice);}
   s.match={opp:opponent(),moment:'一键完成'};s.phase='moment';
   completeMatch(s.injury?-1:(s.pos==='GK'?2:0));count++;
  }
 }finally{batching=false;}
 tab='overview';commit();
 notice('已赛季推演 '+count+' 轮；'+(s.phase==='season_end'?'赛季结束，可查看联赛排名和转会报价':'当前赛季进度已保存'));
}
function exportSave(){if(!s)return;let blob=new Blob([JSON.stringify({game:'绿茵传奇',version:2,save:s},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='绿茵传奇_'+s.name+'_'+s.year+'.json';document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);notice('已导出存档文件');}
async function importSave(file){if(!file||file.size>1024*1024){notice('存档文件过大或无效');return;}try{const txt=await file.text();let data=JSON.parse(txt),candidate=data.save||data;if(!defCheck(candidate))throw Error('存档结构不匹配');if(!confirm('导入存档将替换当前进度，确定继续吗？'))return;s=ensureLegacy(candidate);tab='overview';commit();notice('存档导入成功');}catch(e){notice('导入失败：不是兼容的 v2 存档');}}
function commit(){if(!batching){save();render();}}
function render(){const app=$('app');if(!s){app.innerHTML=welcome();return;}if(s.phase==='moment'&&!s.match){s.phase='prep';}if(!['overview','match','training','market','sponsor','career','save','europe','tactics','manager'].includes(tab))tab='overview';let body={overview,match:matchPanel,training:trainingPanel,market:marketPanel,sponsor:sponsorshipPage,talent:talentsPage,family:familyArchivesPage,career:careerPanel,tactics:tacticsPanel,save:savePanel,europe:europePanel,manager:managerPanel}[tab]();app.innerHTML=shellHTML()+'<div style="margin-top:12px">'+body+'</div>'+(s.phase==='season_end'&&s.lastSummary&&tab==='overview'?'<section class="card" style="margin-top:12px;border-color:#947c4b"><div class="eyebrow">Season Review</div><h2>赛季结算 · '+s.year+'</h2><p>'+s.lastSummary.points+' 分 · '+s.lastSummary.goals+' 球 · '+s.lastSummary.assists+' 助攻 · 场均 '+s.lastSummary.average+'</p><p class="warning">'+(s.lastSummary.won?'🏆 联赛夺冠 · ':'')+(s.lastSummary.cup?'🏆 杯赛冠军 · ':'')+(s.lastSummary.scoring?'🏅 赛季金靴':'')+'</p>'+mainButtons()+'</section>':'');}
$('app').addEventListener('submit',e=>{if(e.target.id!=='startForm')return;e.preventDefault();s=createPlayer(new FormData(e.target));addLog(s,'16岁从 '+s.club+' 青训队开启职业生涯。');tab='overview';commit();});
$('app').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;let newTab=b.dataset.tab;if(newTab){tab=newTab;render();return;}let action=b.dataset.action,i=Number(b.dataset.index||0);if(!action)return;switch(action){case 'mgr-self':if(s.playerManagerMode&&!s.retired){s.selfSelected=b.dataset.value==='yes';commit();}break;case 'mgr-tactic':if(s.playerManagerMode&&['balanced','attack','defend'].includes(b.dataset.value)){s.coachTactic=b.dataset.value;commit();}break;case 'legends':if(s.playerManagerMode){s.legendsGames=(s.legendsGames||0)+1;addLog(s,'参加第'+s.legendsGames+'场元老慈善赛，未计入职业数据。');commit();notice('元老慈善赛已记录');}break;case 'decision-renew':if(s.pendingDecision?.type==='contract'){s.pendingDecision=null;doRenew();}break;case 'decision-market':if(s.pendingDecision?.type==='contract'){s.offers=generateOffers();tab='market';commit();}break;case 'decision-sponsor':if(s.pendingDecision?.type==='sponsor'){tab='sponsor';commit();}break;case 'decision-skip':if(s.pendingDecision?.type==='sponsor'){s.pendingDecision=null;commit();}break;case 'decision-recovery':if(s.pendingDecision?.type==='injury'){s.pendingDecision=null;s.stamina=ratio(s.stamina+20);commit();}break;case 'start-match':startMatch();break;case 'resolve':if(s.phase==='moment')completeMatch(i);break;case 'train':doTrain(b.dataset.value);break;case 'story':resolveStory(i);break;case 'auto-week':fastThree();break;case 'auto-season':autoSeason();break;case 'roll-talent':rolledTalent=freshTalent();render();break;case 'europe-next':simulateEuropeRound();commit();break;case 'europe-all':simulateEuropeAll();break;case 'next-season':nextSeason();break;case 'sign':doSign(i);break;case 'renew':doRenew();break;case 'sign-sponsor':signSponsor(i);break;case 'recalibrate-history':recalibrateHistory();break;case 'restore-history':restoreHistoryStats();break;case 'snapshot':createSafetyBackup();break;case 'restore-snapshot':restoreSafetyBackup();break;case 'export':exportSave();break;case 'import':$('fileUpload').click();break;case 'restart':if(confirm('确定清除当前生涯并重新开始？建议先导出存档。')){localStorage.removeItem(KEY);s=null;tab='overview';render();}break;}});
$('app').addEventListener('change',e=>{if(e.target.id==='leagueSelect'&&!s){const node=$('academySelect');if(node){node.innerHTML=youthClubs(e.target.value).map(c=>'<option>'+esc(c.name)+'</option>').join('');}}});
$('fileUpload').addEventListener('change',e=>{importSave(e.target.files[0]);e.target.value='';});
try{let data=JSON.parse(localStorage.getItem(KEY));if(defCheck(data)){s=ensureLegacy(data);if(!s.leagueTable)s.leagueTable=buildLeague(s);}else{s=startUnitedSave();save();}}catch(e){s=startUnitedSave();save();}render();
})();
